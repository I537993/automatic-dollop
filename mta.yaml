_schema-version: "3.1"
ID: kubota
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
modules:
  - name: kubota-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: sap_nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: kubota-db
      - name: kubota-auth

  - name: kubota-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: sap_nodejs_buildpack
    requires:
      - name: kubota-db

resources:
  - name: kubota-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: kubota-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: default
      path: ./xs-security.json
      config:
        xsappname: kubota-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
